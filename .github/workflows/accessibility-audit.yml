name: Accessibility Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: audit-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun ./demo/build.ts
      - name: Lighthouse accessibility report
        run: bunx @lhci/cli autorun --config=./lighthouserc.cjs
      - name: Pa11y crawl
        run: |
          mkdir -p audit-artifacts
          ./node_modules/.bin/bun --port=5174 ./demo/index.html > /tmp/xgx-ui-demo.log 2>&1 &
          echo $! > /tmp/xgx-ui-demo.pid
          for i in {1..30}; do
            curl -fsS http://localhost:5174 >/dev/null && break
            sleep 1
          done
          bunx pa11y-ci --config ./pa11yci.json --reporter json > pa11y-report.json
          cp /tmp/xgx-ui-demo.log audit-artifacts/demo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-audit
          path: |
            lighthouse-report/
            pa11y-report.json
            audit-artifacts/
