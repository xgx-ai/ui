name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ui-ci-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ui-ci-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
