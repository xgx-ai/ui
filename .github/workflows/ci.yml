name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ui-ci-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ui-ci-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run test:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
